<style>
:root{--bg:#fff7ec;--card:#ffffff;--ink:#2b2118;--mute:#7d6a5c;--line:#2b2118;--sun:#ffd84d;--soft:#fff1d6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;
  background-image:radial-gradient(rgba(43,33,24,.07) 1.5px, transparent 1.5px);background-size:22px 22px}
.hero{background:var(--sun);border-bottom:3px solid var(--ink);border-radius:0 0 36px 36px;transition:background .3s}
.hero-in{max-width:960px;margin:0 auto;padding:26px 16px 22px;display:flex;align-items:center;gap:14px}
.hero-text{flex:1;min-width:0}
.handle{font-weight:900;letter-spacing:.2em;font-size:.76rem}
h1{font-family:'Fredoka',sans-serif;font-weight:700;margin:.15em 0 .2em;font-size:clamp(2rem,7.4vw,3.3rem);line-height:1.02}
.hero p{margin:0;max-width:460px;font-weight:700;font-size:.98rem}
.mascot{flex:0 0 clamp(108px,30vw,170px);position:relative}
.mascot svg{width:100%;height:auto;display:block;animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.bubble{position:absolute;right:74%;top:10px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 10px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.82rem;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.wrap{max-width:960px;margin:0 auto;padding:22px 16px 56px}
.tools{display:flex;flex-direction:column;gap:12px;margin:0 0 22px}
input[type=search]{width:100%;padding:13px 16px;border-radius:16px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:1rem;font-family:inherit;font-weight:700;box-shadow:0 4px 0 var(--ink)}
input[type=search]:focus{outline:3px solid var(--sun);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2.5px solid var(--ink);background:#fff;color:var(--ink);padding:6px 13px;border-radius:999px;font-size:.9rem;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;display:inline-flex;align-items:center;gap:7px;box-shadow:0 3px 0 var(--ink)}
.chip i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.count{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--mute);font-size:.9rem;margin:-8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:0 0 16px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px;box-shadow:0 6px 0 var(--ink);overflow:hidden;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card:target{box-shadow:0 0 0 4px var(--sun),0 6px 0 var(--ink)}
.strip{height:12px;border-bottom:3px solid var(--ink)}
.card > *:not(.strip){margin-left:16px;margin-right:16px}
.thumb{display:block;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--soft);border:2.5px solid var(--ink);margin-top:6px;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.thumb .ph svg{height:86%;width:auto}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.78rem}
.ep{font-family:'Fredoka',sans-serif;font-weight:700;letter-spacing:.06em;background:var(--ink);color:#fff;border-radius:999px;padding:3px 10px}
.tag{font-family:'Fredoka',sans-serif;font-weight:600;border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
.card h2{margin:0;font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.18rem;line-height:1.2}
.desc{margin:0;color:var(--mute);font-size:.92rem;font-weight:700}
.actions{margin-top:auto;display:flex;gap:8px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 12px;border-radius:14px;font-size:.92rem;font-weight:800;text-decoration:none;border:2.5px solid var(--ink);font-family:'Nunito',sans-serif;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.open{background:var(--ink);color:#fff}
.dl{background:#fff;color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.share{flex:0 0 auto;background:var(--sun);color:var(--ink);cursor:pointer}
.empty{display:none;text-align:center;color:var(--mute);padding:20px 0 32px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.1rem}
.empty svg{width:130px;height:auto;display:block;margin:0 auto 8px}
footer{margin-top:40px;text-align:center;color:var(--mute);font-size:.88rem;font-weight:700}
footer svg{width:64px;height:auto;display:block;margin:0 auto 6px}
footer a{color:var(--ink);font-weight:900}
</style>
</head>
<body>
<header class="hero" id="hero">
  <div class="hero-in">
    <div class="hero-text">
      <div class="handle">@DUMBDASHBOARDS</div>

      <p>Data, pop culture and sports. Open them right here, or download the HTML and use them however you like.</p>

    <span id="footScreeny"></span>
    Free to use, no commercial purposes. If you use them, please credit

         '<ellipse cx="910" cy="300" rx="24" ry="18"/><ellipse cx="970" cy="282" rx="24" ry="18"/><rect x="926" y="200" width="11" height="100"/><rect x="984" y="182" width="11" height="100"/><path d="M 926 200 L 995 182 L 995 200 L 926 218 Z"/></g>',
  weird: '<path d="M 400 312 L 430 290 L 455 312 L 482 286 L 510 310 L 540 284 L 570 310 L 598 286 L 625 312 L 652 290 L 680 312 L 560 110 Z" fill="#d6dbe2" stroke="' + INK + '" stroke-width="14" stroke-linejoin="round"/>' +
         '<path d="M 470 270 L 548 140 M 600 270 L 570 160 M 520 230 L 590 230" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".8"/>' +
         '<text x="190" y="300" font-family="Fredoka" font-weight="700" font-size="110" fill="' + INK + '">?</text><text x="860" y="420" font-family="Fredoka" font-weight="700" font-size="90" fill="' + INK + '" transform="rotate(14 880 390)">?</text>'
};
var CHEF = '<path d="M 400 300 L 400 240 Q 340 230 350 175 Q 362 120 425 135 Q 445 80 510 92 Q 545 60 590 92 Q 650 78 668 135 Q 735 122 735 180 Q 740 232 680 240 L 680 300 Z" fill="#ffffff" stroke="' + INK + '" stroke-width="16" stroke-linejoin="round"/>' +
           '<path d="M 400 262 L 680 262" stroke="#f1e6d2" stroke-width="14"/>';


const OUTFIT = {'All':'hub','Sport':'sports','Film & TV':'movies','Anime & Games':'games','Music':'music','Other':'weird'};
const TAGCOL = {'All':'#ffd84d','Sport':'#ffa24a','Film & TV':'#ff8fb3','Anime & Games':'#5fd3c8','Music':'#8ec5ff','Other':'#b49cff'};
const LINES = {'All':'Pick one!','Sport':'Game on!','Film & TV':'Grab the popcorn','Anime & Games':'Press start','Music':'Turn it up','Other':'Trust no data'};
function screenySVG(tag){
  const k = OUTFIT[tag] || 'hub';
  return '<svg viewBox="130 90 820 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Screeny, the dumbdashboards mascot">' + screeny(SCREENS[k]) + ACC[k] + '</svg>';
}

const grid = document.getElementById('grid');
const chipsEl = document.getElementById('chips');
const q = document.getElementById('q');
const empty = document.getElementById('empty');
const tags = ['All', ...Array.from(new Set(DASHBOARDS.map(d => d.tag)))];
let active = 'All';

function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function setMascot(){
  document.getElementById('heroScreeny').innerHTML = screenySVG(active);
  document.getElementById('bubble').textContent = LINES[active] || 'Pick one!';
  document.getElementById('hero').style.background = TAGCOL[active] || '#ffd84d';
}

function render(){
  const term = q.value.trim().toLowerCase();
  const list = DASHBOARDS.filter(d =>
    (active === 'All' || d.tag === active) &&
    (!term || (d.title + ' ' + d.tag + ' ' + d.desc).toLowerCase().includes(term)));
  grid.innerHTML = list.map(d => {
    const id = d.ep ? 'ep' + parseInt(d.ep, 10) : d.file.replace('.html','');
    const col = TAGCOL[d.tag] || '#ffd84d';
    return `<article class="card" id="${id}">
      <div class="strip" style="background:${col}"></div>
      <a class="thumb" href="${esc(d.file)}" tabindex="-1" aria-hidden="true" style="background:${col}33"><img src="thumbs/${esc(d.file.replace(/(-dashboard)?\.html$/,''))}.jpg" alt="" loading="lazy" data-tag="${esc(d.tag)}"></a>
      <div class="meta"><span class="ep">${d.ep ? 'EP. ' + esc(d.ep) : 'EXTRA'}</span><span class="tag" style="background:${col}">${esc(d.tag)}</span></div>
      <h2>${esc(d.title)}</h2>
      <p class="desc">${esc(d.desc)}</p>
      <div class="actions">
        <a class="btn open" href="${esc(d.file)}">Open</a>
        <a class="btn dl" href="${esc(d.file)}" download>Download HTML</a>
        <button class="btn share" type="button" data-id="${id}" aria-label="Copy link to this dashboard">Share</button>
      </div>
    </article>`;
  }).join('');
  grid.querySelectorAll('.thumb img').forEach(img => img.addEventListener('error', () => {
    const ph = document.createElement('div'); ph.className = 'ph'; ph.innerHTML = screenySVG(img.dataset.tag);
    img.replaceWith(ph);
  }, {once:true}));
  empty.style.display = list.length ? 'none' : 'block';
  document.getElementById('count').textContent = list.length + (list.length === 1 ? ' dashboard' : ' dashboards') + (active === 'All' && !term ? ' and counting' : '');
}

chipsEl.innerHTML = tags.map(t => `<button type="button" class="chip" aria-pressed="${t===active}" data-t="${esc(t)}"><i style="background:${TAGCOL[t] || '#ffd84d'}"></i>${esc(t)}</button>`).join('');
chipsEl.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  active = b.dataset.t;
  chipsEl.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.t === active));
  setMascot();
  render();
});
grid.addEventListener('click', async e => {
  const b = e.target.closest('.share'); if (!b) return;
  const url = location.origin + location.pathname + '#' + b.dataset.id;
  try {
    if (navigator.share) { await navigator.share({url}); return; }
    await navigator.clipboard.writeText(url);
  } catch (err) { if (err && err.name === 'AbortError') return; try { prompt('Copy this link:', url); } catch(_){} return; }
  const old = b.textContent; b.textContent = 'Copied!'; setTimeout(() => b.textContent = old, 1500);
});
q.addEventListener('input', render);
document.getElementById('emptyScreeny').innerHTML = screenySVG('Other');
document.getElementById('footScreeny').innerHTML = screenySVG('All');
setMascot();
render();
if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
</script>
</body>
