<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@dumbdashboards — all the dashboards</title>
<meta name="description" content="Interactive dashboards on pop culture and sports. Free to open instantly or download as HTML.">
<style>
:root{--bg:#121a17;--card:#1b2823;--card2:#223330;--ink:#f3efe3;--mute:#9fb0a8;--acc:#f0a83a;--line:#2d413b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 56px}
header{text-align:center;padding:12px 0 24px}
.handle{color:var(--acc);letter-spacing:.18em;font-size:.78rem;font-weight:700}
h1{margin:.3em 0 .2em;font-size:clamp(1.9rem,6vw,3rem);line-height:1.05;color:var(--acc)}
header p{margin:0 auto;max-width:520px;color:var(--mute)}
.tools{display:flex;flex-direction:column;gap:12px;margin:8px 0 22px}
input[type=search]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem}
input[type=search]:focus{outline:2px solid var(--acc);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;font-size:.88rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:#1a1a12;border-color:var(--acc);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px}
.card:target{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--mute)}
.ep{color:var(--acc);font-weight:700;letter-spacing:.08em}
.card h2{margin:0;font-size:1.08rem;line-height:1.25}
.actions{margin-top:auto;display:flex;gap:8px}
.btn{flex:1;text-align:center;padding:10px 12px;border-radius:10px;font-size:.92rem;font-weight:700;text-decoration:none}
.open{background:var(--acc);color:#1a1a12}
.dl{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.empty{display:none;text-align:center;color:var(--mute);padding:32px 0}
footer{margin-top:36px;text-align:center;color:var(--mute);font-size:.85rem}
footer a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="handle">@DUMBDASHBOARDS</div>
    <h1>All the dashboards</h1>
    <p>Data, pop culture and sports. Open them right here, or download the HTML and use them however you like.</p>
  </header>

  <div class="tools">
    <input type="search" id="q" placeholder="Search a dashboard…" aria-label="Search a dashboard">
    <div class="chips" id="chips"></div>
  </div>

  <main class="grid" id="grid"></main>
  <div class="empty" id="empty">No dashboards found.</div>

  <footer>
    Free to use, no commercial purposes. If you use them, please credit
    <a href="https://www.instagram.com/dumbdashboards/">@dumbdashboards</a>.
  </footer>
</div>

<script>
/* To add a dashboard, add one line below.
   file = name of the .html file in the repository, ep = episode number (or "" if none),
   tag = one of: Music, Sport, Film & TV, Anime & Games, Other. Newest go on top. */
const DASHBOARDS = [
  {file:"fatbearweek-dashboard.html", ep:"19", title:"Fat Bear Week — The Data", tag:"Other"},
  {file:"oasis-dashboard.html", ep:"18", title:"Oasis Live '25 / '27 — Tour Analytics", tag:"Music"},
  {file:"sbr-dashboard.html", ep:"17", title:"Steel Ball Run — Race Analytics", tag:"Anime & Games"},
  {file:"harrystyles-dashboard.html", ep:"16", title:"Together, Together — Tour Analytics", tag:"Music"},
  {file:"jumpscare-dashboard.html", ep:"15", title:"Jump Scare Analytics — Q3 Report", tag:"Film & TV"},
  {file:"dumbquestions-dashboard.html", ep:"14", title:"The Dumb Questions Machine", tag:"Other"},
  {file:"silenthill-dashboard.html", ep:"13", title:"Silent Hill — Case File", tag:"Anime & Games"},
  {file:"secretlair-dashboard.html", ep:"12", title:"Secret Lair — The Vault Ledger", tag:"Anime & Games"},
  {file:"anatomy-impact-football.html", ep:"11", title:"Anatomy of the Impact — Football Strike", tag:"Sport"},
  {file:"f1-dashboard.html", ep:"10", title:"F1 2026 — The Reset", tag:"Sport"},
  {file:"kingdomhearts-dashboard.html", ep:"09", title:"Kingdom Hearts — The Data Corridor", tag:"Anime & Games"},
  {file:"himym-dashboard.html", ep:"08", title:"HIMYM — The MacLaren's Report", tag:"Film & TV"},
  {file:"sinner-dashboard.html", ep:"07", title:"Sinner — Court Vision", tag:"Sport"},
  {file:"onepiece-dashboard.html", ep:"06", title:"One Piece — Bounty Board", tag:"Anime & Games"},
  {file:"strokes-dashboard.html", ep:"05", title:"The Strokes — Channel Strip 001", tag:"Music"},
  {file:"coyote-dashboard.html", ep:"04", title:"The People (Coyote) v. ACME Corp.", tag:"Film & TV"},
  {file:"spiderman-dashboard.html", ep:"03", title:"Spidey-Metrics — Three Eras, Compared", tag:"Film & TV"},
  {file:"odyssey-map.html", ep:"02", title:"The Odyssey — A Ten-Year Delay Report", tag:"Other"},
  {file:"trolley-game.html", ep:"01", title:"Trolley Tracks — The Impossible Dilemma", tag:"Other"}
];

const grid = document.getElementById('grid');
const chipsEl = document.getElementById('chips');
const q = document.getElementById('q');
const empty = document.getElementById('empty');
const tags = ['All', ...Array.from(new Set(DASHBOARDS.map(d => d.tag)))];
let active = 'All';

function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const term = q.value.trim().toLowerCase();
  const list = DASHBOARDS.filter(d =>
    (active === 'All' || d.tag === active) &&
    (!term || (d.title + ' ' + d.tag).toLowerCase().includes(term)));
  grid.innerHTML = list.map(d => {
    const id = d.ep ? 'ep' + parseInt(d.ep, 10) : d.file.replace('.html','');
    return `<article class="card" id="${id}">
      <div class="meta"><span class="ep">${d.ep ? 'EP. ' + esc(d.ep) : ''}</span><span>${esc(d.tag)}</span></div>
      <h2>${esc(d.title)}</h2>
      <div class="actions">
        <a class="btn open" href="${esc(d.file)}">Open</a>
        <a class="btn dl" href="${esc(d.file)}" download>Download HTML</a>
      </div>
    </article>`;
  }).join('');
  empty.style.display = list.length ? 'none' : 'block';
}

chipsEl.innerHTML = tags.map(t => `<button type="button" class="chip" aria-pressed="${t===active}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
chipsEl.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  active = b.dataset.t;
  chipsEl.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.t === active));
  render();
});
q.addEventListener('input', render);
render();
if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
</script>
</body>
</html>
